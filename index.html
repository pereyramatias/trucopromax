<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Truco Pro 🥩</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥩</text></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body {
            background-color: #0b1120;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.08), transparent 25%);
            background-attachment: fixed;
            color: #f8fafc;
        }
        .glass-panel {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.4) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .glass-nav {
            background: rgba(11, 17, 32, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .premium-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }
        .premium-input:focus {
            background: rgba(15, 23, 42, 0.9);
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }
        select[multiple] { height: 160px; scrollbar-width: none; }
        select[multiple]::-webkit-scrollbar { display: none; }
        select[multiple] option { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.02); border-radius: 8px; margin-bottom: 4px; transition: all 0.2s; }
        select[multiple] option:checked { background: #0ea5e9; color: white; font-weight: 600; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3); }
        .gradient-text {
            background: linear-gradient(to right, #e0f2fe, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="pb-32 min-h-screen selection:bg-brand-500 selection:text-white">

    <!-- Header -->
    <header class="pt-8 pb-4 px-6 sticky top-0 z-10 bg-[#0b1120]/80 backdrop-blur-xl border-b border-white/5">
        <div class="flex justify-between items-center max-w-lg mx-auto">
            <div>
                <h1 class="text-2xl font-extrabold gradient-text tracking-tight">TRUCO PRO</h1>
                <p class="text-xs text-slate-400 font-medium tracking-wide mt-0.5">Asado League 🥩</p>
            </div>
            <div class="w-10 h-10 rounded-full bg-brand-500/10 flex items-center justify-center border border-brand-500/20 text-brand-400">
                <i class="ph ph-cards text-2xl"></i>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 max-w-lg mx-auto">
        
        <!-- View: Leaderboard -->
        <section id="view-leaderboard" class="view-section animate-slide-up">
            <div class="flex justify-between items-end mb-6 px-2">
                <h2 class="text-xl font-bold text-white">Ranking Global</h2>
                <button id="btn-refresh" class="text-slate-400 hover:text-white transition-colors p-2 -mr-2">
                    <i class="ph ph-arrows-clockwise text-xl"></i>
                </button>
            </div>
            
            <div id="loading-leaderboard" class="text-center py-20 text-slate-400">
                <i class="ph ph-spinner-gap animate-spin text-4xl text-brand-400 mb-4 inline-block"></i>
                <p class="text-sm font-medium">Sincronizando con la mesa...</p>
            </div>

            <div class="glass-panel rounded-3xl overflow-hidden hidden" id="table-container">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] uppercase tracking-widest text-slate-400 border-b border-white/5 bg-white/[0.02]">
                            <th class="py-4 pl-5 w-12 font-semibold">#</th>
                            <th class="py-4 font-semibold">Jugador</th>
                            <th class="py-4 text-center font-semibold text-brand-400">Pts</th>
                            <th class="py-4 text-center font-semibold pr-4">PJ</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="text-sm">
                        <!-- JS -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- View: History -->
        <section id="view-history" class="view-section hidden animate-slide-up">
            <h2 class="text-xl font-bold text-white mb-6 px-2">Últimos Partidos</h2>
            <div id="history-container" class="space-y-4">
                <!-- JS -->
            </div>
        </section>

        <!-- View: Match -->
        <section id="view-match" class="view-section hidden animate-slide-up">
            <h2 class="text-xl font-bold text-white mb-6 px-2">Registrar Resultado</h2>
            
            <form id="match-form" class="space-y-6">
                <!-- Equipo A -->
                <div class="glass-panel p-5 rounded-3xl relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                    <label class="flex items-center gap-2 text-sm font-bold text-white mb-3">
                        <div class="w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.8)]"></div>
                        Equipo Azul
                    </label>
                    <div id="team-a-chips" class="flex flex-wrap gap-2">
                        <!-- JS -->
                    </div>
                </div>

                <div class="flex justify-center -my-2 relative z-10">
                    <div class="bg-[#0b1120] border border-white/10 text-slate-400 font-bold px-4 py-1.5 rounded-full text-xs tracking-widest shadow-lg">
                        VERSUS
                    </div>
                </div>

                <!-- Equipo B -->
                <div class="glass-panel p-5 rounded-3xl relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-red-500"></div>
                    <label class="flex items-center gap-2 text-sm font-bold text-white mb-3">
                        <div class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]"></div>
                        Equipo Rojo
                    </label>
                    <div id="team-b-chips" class="flex flex-wrap gap-2">
                        <!-- JS -->
                    </div>
                </div>

                <!-- Ganador -->
                <div class="pt-4">
                    <label class="block text-center text-sm font-bold text-slate-300 mb-4">Seleccioná al Ganador 🏆</label>
                    <div class="grid grid-cols-2 gap-4">
                        <button type="button" id="btn-win-a" class="py-5 rounded-2xl font-bold text-sm border border-blue-500/30 bg-blue-500/10 text-blue-400 transition-all active:scale-95 flex flex-col items-center gap-2">
                            <i class="ph-fill ph-check-circle text-2xl opacity-0 transition-opacity" id="icon-win-a"></i>
                            AZUL
                        </button>
                        <button type="button" id="btn-win-b" class="py-5 rounded-2xl font-bold text-sm border border-red-500/30 bg-red-500/10 text-red-400 transition-all active:scale-95 flex flex-col items-center gap-2">
                            <i class="ph-fill ph-check-circle text-2xl opacity-0 transition-opacity" id="icon-win-b"></i>
                            ROJO
                        </button>
                    </div>
                    <input type="hidden" id="match-winner" value="">
                </div>

                <button type="submit" id="btn-save-match" class="w-full bg-brand-500 hover:bg-brand-400 text-white font-bold text-lg py-5 rounded-2xl shadow-[0_8px_20px_rgba(14,165,233,0.3)] transition-all active:scale-95 disabled:opacity-50 disabled:scale-100 flex justify-center items-center gap-2 mt-4">
                    <i class="ph ph-paper-plane-tilt text-xl"></i>
                    Guardar Partido
                </button>
            </form>
        </section>

        <!-- View: New Player -->
        <section id="view-player" class="view-section hidden animate-slide-up">
            <h2 class="text-xl font-bold text-white mb-6 px-2">Agregar Jugador</h2>
            
            <div class="glass-panel p-6 rounded-3xl">
                <form id="player-form" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium mb-2 text-slate-400">Nombre o Apodo</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                                <i class="ph ph-user text-xl"></i>
                            </div>
                            <input type="text" id="new-player-name" class="w-full premium-input rounded-2xl py-4 pl-12 pr-4 text-white text-lg outline-none" placeholder="Ej: Fideo" autocomplete="off" required>
                        </div>
                    </div>
                    
                    <button type="submit" id="btn-save-player" class="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-bold text-lg py-5 rounded-2xl shadow-[0_8px_20px_rgba(16,185,129,0.2)] transition-all active:scale-95 disabled:opacity-50 flex justify-center items-center gap-2">
                        <i class="ph ph-user-plus text-xl"></i>
                        Sumar Jugador
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 w-full glass-nav flex justify-around pt-4 px-2 z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]" style="padding-bottom: calc(1rem + env(safe-area-inset-bottom));">
        <button onclick="switchView('leaderboard')" class="nav-btn flex flex-col items-center gap-1.5 p-2 text-slate-500 hover:text-white flex-1 transition-colors group" data-target="view-leaderboard">
            <i class="ph-fill ph-trophy text-2xl group-[.active]:text-brand-400 transition-colors"></i>
            <span class="text-[10px] font-semibold tracking-wide group-[.active]:text-white transition-colors">Ranking</span>
        </button>
        <button onclick="switchView('history')" class="nav-btn flex flex-col items-center gap-1.5 p-2 text-slate-500 hover:text-white flex-1 transition-colors group" data-target="view-history">
            <i class="ph-fill ph-clock-counter-clockwise text-2xl group-[.active]:text-brand-400 transition-colors"></i>
            <span class="text-[10px] font-semibold tracking-wide group-[.active]:text-white transition-colors">Historial</span>
        </button>
        <button onclick="switchView('match')" class="nav-btn flex flex-col items-center gap-1.5 p-2 text-slate-500 hover:text-white flex-1 transition-colors group" data-target="view-match">
            <i class="ph-fill ph-sword text-2xl group-[.active]:text-brand-400 transition-colors"></i>
            <span class="text-[10px] font-semibold tracking-wide group-[.active]:text-white transition-colors">Partido</span>
        </button>
        <button onclick="switchView('player')" class="nav-btn flex flex-col items-center gap-1.5 p-2 text-slate-500 hover:text-white flex-1 transition-colors group" data-target="view-player">
            <i class="ph-fill ph-user-plus text-2xl group-[.active]:text-brand-400 transition-colors"></i>
            <span class="text-[10px] font-semibold tracking-wide group-[.active]:text-white transition-colors">Nuevo</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
