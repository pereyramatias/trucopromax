<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Liga de Truco 🥩🃏</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥩</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            /* Fondo con gradiente sutil */
            background-image: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            background-attachment: fixed;
        }
        .arg-accent { color: #7dd3fc; }
        .bg-arg-accent { background: linear-gradient(135deg, #38bdf8, #7dd3fc); }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        ::-webkit-scrollbar { display: none; }
        select[multiple] { height: 140px; }
        select[multiple] option { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        select[multiple] option:checked { background: linear-gradient(135deg, #38bdf8, #7dd3fc); color: #0f172a; font-weight: bold; }
    </style>
</head>
<body class="pb-28 font-sans antialiased min-h-screen">
    
    <!-- Header -->
    <header class="glass-card p-4 sticky top-0 z-10 flex justify-center items-center shadow-lg border-b-0">
        <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-200 tracking-widest uppercase drop-shadow-sm">
            Liga de Truco <span class="text-white drop-shadow-none">🥩🃏</span>
        </h1>
    </header>

    <!-- Main Content -->
    <main class="p-4 max-w-lg mx-auto">
        <!-- View: Leaderboard -->
        <section id="view-leaderboard" class="view-section">
            <h2 class="text-2xl font-bold mb-5 flex items-center justify-between text-sky-100">
                <span>Ranking 🏆</span>
                <button id="btn-refresh" class="text-sky-200 hover:text-white p-2 glass-card rounded-full w-10 h-10 flex items-center justify-center transition-all shadow-md active:scale-95">↻</button>
            </h2>
            
            <div id="loading-leaderboard" class="text-center py-12 text-sky-200">
                <div class="animate-spin inline-block w-10 h-10 border-[4px] border-current border-t-transparent text-sky-400 rounded-full" role="status"></div>
                <p class="mt-4 font-medium animate-pulse">Barajando y dando de nuevo...</p>
            </div>

            <div class="glass-card rounded-2xl overflow-hidden shadow-xl hidden" id="table-container">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800/80 text-sky-200 text-xs uppercase tracking-wider">
                            <th class="p-4 text-center w-12 rounded-tl-2xl">#</th>
                            <th class="p-4">Jugador</th>
                            <th class="p-4 text-center">Pts</th>
                            <th class="p-4 text-center text-[10px] opacity-80">PJ</th>
                            <th class="p-4 text-center text-[10px] opacity-80 rounded-tr-2xl">% W</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="text-sm">
                        <!-- Filas inyectadas por JS -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- View: History -->
        <section id="view-history" class="view-section hidden">
            <h2 class="text-2xl font-bold mb-5 text-sky-100">Historial 📜</h2>
            <div id="history-container" class="space-y-5">
                <!-- Tarjetas inyectadas por JS -->
            </div>
        </section>

        <!-- View: Match -->
        <section id="view-match" class="view-section hidden">
            <h2 class="text-2xl font-bold mb-5 text-sky-100">Registrar Partido ✍️</h2>
            
            <div class="glass-card p-5 rounded-3xl shadow-xl mb-6">
                <form id="match-form">
                    
                    <!-- Equipo A -->
                    <div class="mb-5">
                        <label class="block text-sm font-bold mb-2 text-blue-300 uppercase tracking-wide">Equipo A (Azul)</label>
                        <select id="team-a" multiple class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all text-base shadow-inner">
                            <!-- Opciones -->
                        </select>
                        <p class="text-xs text-slate-400 mt-2 italic">Mantené presionado para elegir varios.</p>
                    </div>

                    <div class="flex justify-center items-center my-4">
                        <span class="bg-slate-800 text-slate-300 font-black px-4 py-1 rounded-full shadow-md text-sm border border-slate-700">VS</span>
                    </div>

                    <!-- Equipo B -->
                    <div class="mb-6">
                        <label class="block text-sm font-bold mb-2 text-red-300 uppercase tracking-wide">Equipo B (Rojo)</label>
                        <select id="team-b" multiple class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-2 text-white focus:outline-none focus:ring-2 focus:ring-red-500 transition-all text-base shadow-inner">
                            <!-- Opciones -->
                        </select>
                    </div>

                    <!-- Puntos (Opcional) -->
                    <div class="mb-8 flex gap-4">
                        <div class="flex-1 bg-slate-900/30 p-3 rounded-2xl border border-slate-700/50">
                            <label class="block text-xs font-semibold mb-2 text-slate-300 text-center uppercase tracking-wider">Puntos A <span class="text-[9px] opacity-70 block normal-case">(Opcional)</span></label>
                            <input type="number" id="points-a" class="w-full bg-transparent border-b-2 border-slate-600 p-2 text-white text-center text-xl font-bold focus:outline-none focus:border-blue-400 transition-colors" placeholder="0" min="0" max="30">
                        </div>
                        <div class="flex-1 bg-slate-900/30 p-3 rounded-2xl border border-slate-700/50">
                            <label class="block text-xs font-semibold mb-2 text-slate-300 text-center uppercase tracking-wider">Puntos B <span class="text-[9px] opacity-70 block normal-case">(Opcional)</span></label>
                            <input type="number" id="points-b" class="w-full bg-transparent border-b-2 border-slate-600 p-2 text-white text-center text-xl font-bold focus:outline-none focus:border-red-400 transition-colors" placeholder="0" min="0" max="30">
                        </div>
                    </div>

                    <!-- Ganador -->
                    <div class="mb-8">
                        <label class="block text-sm font-bold mb-3 text-slate-200 text-center uppercase tracking-wide">¿Quién ganó? 👑</label>
                        <div class="flex gap-4">
                            <button type="button" id="btn-win-a" class="flex-1 py-4 rounded-2xl font-black text-lg border-2 border-blue-500/50 bg-slate-800 text-blue-400 shadow-md transition-all active:scale-95">EQUIPO A</button>
                            <button type="button" id="btn-win-b" class="flex-1 py-4 rounded-2xl font-black text-lg border-2 border-red-500/50 bg-slate-800 text-red-400 shadow-md transition-all active:scale-95">EQUIPO B</button>
                        </div>
                        <input type="hidden" id="match-winner" value="">
                    </div>

                    <button type="submit" id="btn-save-match" class="w-full bg-arg-accent text-slate-900 font-black text-xl py-5 rounded-2xl shadow-[0_0_15px_rgba(56,189,248,0.4)] transition-all active:scale-95 disabled:opacity-50 disabled:shadow-none">
                        GUARDAR RESULTADO 🚀
                    </button>
                </form>
            </div>
        </section>

        <!-- View: New Player -->
        <section id="view-player" class="view-section hidden">
            <h2 class="text-2xl font-bold mb-5 text-sky-100">Nuevo Jugador 👤</h2>
            
            <div class="glass-card p-6 rounded-3xl shadow-xl">
                <form id="player-form">
                    <div class="mb-8">
                        <label class="block text-sm font-bold mb-3 text-slate-200 uppercase tracking-wide">Nombre del pibe/piba</label>
                        <input type="text" id="new-player-name" class="w-full bg-slate-900/50 border border-slate-600 rounded-2xl p-4 text-white focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-transparent text-xl shadow-inner transition-all" placeholder="Ej: El Dibu" autocomplete="off" required>
                    </div>
                    
                    <button type="submit" id="btn-save-player" class="w-full bg-gradient-to-r from-emerald-500 to-emerald-400 text-white font-black text-xl py-5 rounded-2xl shadow-[0_0_15px_rgba(16,185,129,0.4)] transition-all active:scale-95 disabled:opacity-50 disabled:shadow-none">
                        SUMAR AL ASADO 🍷
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-4 left-4 right-4 glass-card rounded-3xl flex justify-around p-2 z-20 shadow-2xl items-end">
        <button onclick="switchView('leaderboard')" class="nav-btn flex flex-col items-center p-2 text-slate-400 hover:text-sky-300 flex-1 transition-colors" data-target="view-leaderboard">
            <span class="text-2xl mb-1 drop-shadow-sm">🏆</span>
            <span class="text-[11px] font-bold tracking-wide">Ranking</span>
        </button>
        <button onclick="switchView('history')" class="nav-btn flex flex-col items-center p-2 text-slate-400 hover:text-sky-300 flex-1 transition-colors" data-target="view-history">
            <span class="text-2xl mb-1 drop-shadow-sm">📜</span>
            <span class="text-[11px] font-bold tracking-wide">Historial</span>
        </button>
        
        <!-- Botón Cargar Partido -->
        <button onclick="switchView('match')" class="nav-btn flex flex-col items-center p-2 text-slate-400 hover:text-sky-300 flex-1 transition-colors" data-target="view-match">
            <span class="text-2xl mb-1 drop-shadow-sm">⚔️</span>
            <span class="text-[11px] font-bold tracking-wide">Partido</span>
        </button>

        <button onclick="switchView('player')" class="nav-btn flex flex-col items-center p-2 text-slate-400 hover:text-sky-300 flex-1 transition-colors" data-target="view-player">
            <span class="text-2xl mb-1 drop-shadow-sm">👤</span>
            <span class="text-[11px] font-bold tracking-wide">Nuevo</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
